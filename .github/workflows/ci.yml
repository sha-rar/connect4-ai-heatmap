name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the version used to build the committed WASM files.
  EMSDK_VERSION: 6.0.13
  NODE_VERSION: 24

jobs:
  native:
    name: Native engine (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            os: ubuntu-24.04
            configure: -DCMAKE_CXX_COMPILER=g++
          - name: Clang
            os: ubuntu-24.04
            configure: -DCMAKE_CXX_COMPILER=clang++
          - name: MSVC
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        run: cmake --build engine/build --config Release --parallel

      - name: Test
        run: ctest --test-dir engine/build -C Release --output-on-failure --parallel 4

  wasm:
    name: WebAssembly engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build
        run: |
          source ~/emsdk/emsdk_env.sh
          node scripts/build-wasm.mjs

      - name: Check the committed build is up to date
        run: |
          if ! git diff --quiet -- apps/web/src/engine/generated; then
            git diff --stat -- apps/web/src/engine/generated
            echo "::error::The committed WebAssembly build differs from the engine sources. Run 'pnpm build:wasm' and commit apps/web/src/engine/generated."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-engine
          path: |
            apps/web/src/engine/generated/connect4.js
            apps/web/src/engine/generated/connect4.wasm
          if-no-files-found: error

  web:
    name: TypeScript and browser tests
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Test the engine built from this commit's sources, not only the committed copy.
      - uses: actions/download-artifact@v4
        with:
          name: wasm-engine
          path: apps/web/src/engine/generated

      - name: Unit and shared rule tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/.report
            tests/e2e/.results
          retention-days: 7
